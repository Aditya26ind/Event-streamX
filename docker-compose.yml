services:
  producer:
    image: eventstreamx:latest
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./data:/app/data
    working_dir: /app
    command: python scripts/kafka_producer.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: events
      S3_STORAGE_ENABLED: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: eventstreamx-data
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    restart: unless-stopped
    depends_on:
      - kafka
      - minio
      - minio-init
  consumer:
    image: eventstreamx:latest
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ./data:/app/data
    working_dir: /app
    command: python scripts/kafka_consumer.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: events
      KAFKA_GROUP_ID: eventstreamx-consumer
      KAFKA_BATCH_SIZE: 10
      S3_STORAGE_ENABLED: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: eventstreamx-data
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    restart: unless-stopped
    depends_on:
      - kafka
      - minio
      - minio-init
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio-data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      /usr/bin/mc mb --ignore-existing local/eventstreamx-data
      "
